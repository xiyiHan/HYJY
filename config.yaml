# ============================================================
# 会议纪要工具 配置文件
# ------------------------------------------------------------
# 本文件可提交到版本库，请勿在此写入 API Key。
# 密钥请放在 config.local.yaml（已被 .gitignore 忽略）或环境变量中。
#
# 路径占位符说明：{project_dir} 表示项目根目录，{workspace} 表示工作目录。
# 本机 C 盘空间紧张，所有大体积目录已强制指向 D 盘，请勿改回 C 盘。
# ============================================================

paths:
  project_dir: "D:/workbuddy-test/meeting-minutes"
  workspace: "{project_dir}/workspace"
  audio: "{workspace}/audio"
  transcript: "{workspace}/transcript"
  minutes: "{workspace}/minutes"
  # 模型与缓存是磁盘占用大户，必须留在 D 盘
  model_dir: "{project_dir}/models"
  cache_dir: "{project_dir}/.cache"

# ------------------------------------------------------------
# 转写引擎：改 backend 即可切换，无需改动任何代码
#   funasr          —— 阿里达摩院，中文专优，自带 VAD/标点/说话人分离（当前选用）
#   faster_whisper  —— CTranslate2 加速版 Whisper，多语种，作为备选
# ------------------------------------------------------------
transcription:
  backend: "funasr"

  # 同说话人相邻段落的合并。
  #
  # 转写引擎为对齐时间戳会把整句话切成很多小段。实测一场 47 分钟的真实会议
  # 产出 1218 段、平均每段仅 10.9 字、25% 的段不足 5 字 —— 既难读，也让
  # 大模型更容易丢失上下文。合并后纪要质量明显提升。
  #
  # 注意：合并只影响文字稿的排版与给模型的输入，不改变原始时间戳范围，
  # 合并后的段落仍以首段的开始时间为准。
  merge:
    enabled: true
    max_gap_s: 4.0        # 相邻两段开始时间间隔超过此值则不合并
    max_duration_s: 90    # 合并后单段最长时长（秒）
    max_chars: 400        # 合并后单段最长字数

  funasr:
    model: "paraformer-zh"        # 中文语音识别主模型
    vad_model: "fsmn-vad"         # 语音活动检测，长音频自动切分
    punc_model: "ct-punc"         # 标点恢复
    spk_model: "cam++"            # 说话人分离，用于区分"谁说的"
    device: "cpu"                 # cpu 或 cuda
    ncpu: 4                       # 本机 4 核心，勿超过物理核数
    # 单批处理音频秒数。实测 47 分钟音频时进程内存达 2.28 GB，而本机空闲仅约
    # 2.5 GB，余量过小，因此从 300 下调到 150。内存更紧张时可继续调到 60~100。
    batch_size_s: 150
    disable_update: true          # 关闭 modelscope 自动检查更新

    # 热词：提升 ASR 对专有名词的识别率。
    # 可用逗号、顿号或空格分隔，程序会自动转换引擎要求的格式。
    #
    # 【重要】热词必须按会议主题定制。实测中拿着"监理"领域的热词去转写
    # "行业信息化"会议，等于完全没起作用 —— 主题不匹配的热词白填。
    # 建议每接一个新项目就先跑一场，看哪些专有名词被识别错了，再针对性补。
    # 热词过多反而会分散模型注意力，建议控制在 30 个以内。
    #
    # 下面按领域给出两组示例，按当前项目选择其一。
    hotword: "某某科技,信息化工程监理,总监理工程师,监理通知单,初步验收,最终验收,竣工验收,隐蔽工程,综合布线,桥架,弱电井,核心交换机,业务系统,建设单位,承建单位,监理单位"

    # 医疗卫生信息化项目（例如"一张网""统一码平台"类）可改用下面这组：
    # hotword: "卫生健康委员会,全民健康,一张网,统一码平台,某单位,某单位,物资储备,物资调配,业务使用,志愿参与,参与者,加工处理,冷链监控,用血机构,三甲医院,县区医院,基层医疗,公立医院,高质量发展,电子病历,互联互通"

  # 术语规范化：转写完成后做一次确定性文本替换，两个引擎都生效。
  #
  # 【默认关闭】盲目的替换有破坏正常语句的风险。典型反例：
  #   把"建立"改成"监理" —— 但"建立制度""建立台账"都是合法用法，
  #   一旦替换就会把正确的句子改错。
  # 因此这里只给出示例，请依据你在真实录音里实际观察到的误识别再启用。
  #
  # 启用前建议用 mm.py glossary --test <文字稿> 预演，确认改动都符合预期。
  glossary:
    enabled: false
    # 同音误识别纠正（示例，按实际观察填写）。
    # 只写那些在监理语境下几乎不可能是正确词的字样。
    replacements:
      "俊工": "竣工"
      "峻工": "竣工"
      "招镖": "招标"
      "验受": "验收"
    # 统一写法（示例）：同一概念在不同段落写法不一致时用。
    # 启用前请确认贵单位的习惯叫法，不要照搬。
    #   "甲方": "建设单位"
    #   "乙方": "承建单位"
    # 正则替换（高级用法），可处理变体写法：
    #   - pattern: "监理(工程师)?通知单"
    #     replace: "监理通知单"

  faster_whisper:
    model: "small"                # tiny / base / small / medium / large-v3
    device: "auto"                # auto / cpu / cuda
    compute_type: "int8"          # CPU 用 int8，GPU 用 float16
    language: "zh"                # 留空则自动检测
    vad_filter: true
    beam_size: 5
    initial_prompt: ""            # 引导词，可填入本单位专有名词
    # HuggingFace 镜像地址。
    # 实测本机直连 huggingface.co 不通（HTTP 000），hf-mirror.com 可用（HTTP 200）。
    # 若你的网络能直连 HuggingFace，把此项留空即可。
    hf_endpoint: "https://hf-mirror.com"

# ------------------------------------------------------------
# 云端纪要生成
# provider 指向下方 providers 表中的任意 key，切换平台只改这一行
# ------------------------------------------------------------
llm:
  provider: "deepseek"
  temperature: 0.3                # 纪要要求稳定，不宜过高
  max_tokens: 8192
  timeout: 300
  # 长文字稿自动分段摘要的阈值（字符数）。超出则先分块提炼再汇总。
  chunk_threshold: 24000

# ------------------------------------------------------------
# 云端平台注册表
# 全部走 OpenAI 兼容协议，因此新增平台只需在此追加一段配置。
#
# compliance 字段来自对各平台用户协议与专用条款的逐条审阅（2026-09），
# 仅供提醒，不构成法律意见。重要提醒：必须使用开放平台 API，
# 不可使用网页版或 App —— 同一厂商两条轨道的条款完全不同。
# ------------------------------------------------------------
providers:
  deepseek:
    label: "DeepSeek 开放平台"
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    compliance: "协议未含训练许可条款，输出权利与所有权归用户；注意网页端默认参与优化，本工具走 API 轨道"
    note: "默认选中。合规强度最高，中文质量好，单价最低。"

  volcengine:
    label: "火山方舟（字节跳动）"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-pro-32k"
    api_key_env: "ARK_API_KEY"
    compliance: "专用条款 3.7.7：未经单独同意，不存储、不使用数据训练或优化模型"
    note: "model 字段需填写方舟控制台创建的推理接入点 ID（形如 ep-xxxx）"

  aliyun_bailian:
    label: "阿里云百炼（通义千问）"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    api_key_env: "DASHSCOPE_API_KEY"
    compliance: "明确承诺绝不会将数据用于模型训练"
    note: "同一家的 FunASR 已在本地承担转写，转写与纪要同源，便于统一口径"

  zhipu:
    label: "智谱 AI"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4-plus"
    api_key_env: "ZHIPU_API_KEY"
    compliance: "限定匿名化之后可用于机器学习或模型算法训练，合规强度相对较低"
    note: "不建议用于敏感内容"

  custom:
    label: "自定义（任意 OpenAI 兼容端点）"
    base_url: ""                  # 例：http://127.0.0.1:8000/v1 或内网自建服务
    model: ""
    api_key_env: "CUSTOM_API_KEY"
    compliance: "取决于所选服务，请自行核验其数据处理条款"
    note: "可用于接入单位内网部署的合规大模型服务"

# ------------------------------------------------------------
# 纪要输出模板
# 设为 "supervision" 用监理会议纪要格式，设为 "generic" 用通用会议纪要格式。
# 也可直接写自定义提示词的路径（相对项目根目录）。
# ------------------------------------------------------------
output:
  # 纪要输出模式：
  #   supervision      通用监理会议纪要（Markdown，六个一级章节）
  #   generic          通用会议纪要（Markdown）
  #   supervision_form 结构化输出，用于填充单位正式模板（配合下方 template 段）
  template: "supervision"
  language: "zh"
  # 是否同时导出 Word 版纪要。使用原生导出（python-docx），无需安装 pandoc。
  export_docx: true

  # Word 导出的排版设置。默认按中文公文习惯：黑体标题 + 仿宋正文。
  # 正文默认小四（12pt）。若需严格对齐公文标准，可改为
  # body_font: "仿宋_GB2312"、body_size_pt: 16（三号）、line_spacing_pt: 28。
  docx:
    title_font: "黑体"
    title_size_pt: 18
    heading_font: "黑体"
    heading_size_pt: 14
    body_font: "仿宋"
    body_size_pt: 12
    line_spacing_pt: 22

# ------------------------------------------------------------
# 单位正式模板填充
#
# 启用后，程序以单位模板文件为底稿生成纪要，**完整保留模板原有格式**
# （字体、表格线、复选框、页边距），而不是另排一份。
# 对归档文件而言这是必要做法 —— 重新排版会失去单位的格式合规性。
#
# 使用时需把 output.template 改为 supervision_form（CLI 的 --form 会自动设置）。
# ------------------------------------------------------------
template:
  enabled: false
  path: ""                      # 模板 .docx 的绝对路径，例如 F:/项目用表（新）/.../02会议纪要.docx
  # 以下为已知信息。这些是确定的事实，交给模型后它就不必从文字稿里猜，
  # 能显著减少"（文字稿未提及）"，也避免模型臆造单位全称。
  known:
    project: ""                 # 项目名称，如 某某市政务信息化建设项目
    owner_unit: ""              # 建设单位全称
    builder_unit: ""            # 承建单位全称
    supervisor_unit: ""         # 监理单位全称
    topic: ""                   # 会议主题（留空则由模型从文字稿归纳）
    location: ""                # 会议地点
    meeting_no: ""              # 会议次数，如 第3次

recording:
  sample_rate: 16000              # 转写模型统一按 16k 处理，勿改
  channels: 1
  # true 时同时录制系统音频（会议对方声音）与本机麦克风
  capture_system_audio: true
  capture_microphone: true
  chunk_seconds: 10               # 分片写入间隔，异常中断时可保住已完成部分
